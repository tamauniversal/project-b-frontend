  <style>
    /* Japanese Morandi Design Language */
    :root {
      --bg-main: #ebebe9;
      --bg-card: #ffffff;
      --border-color: #d1d1cc;
      --text-main: #33393e;
      --text-muted: #626a70;
      --text-light: #8e979e;

      --surface-1: #fafaf9;   /* 淡底面板 */
      --surface-2: #edece8;   /* 長條軌 / 內嵌底 */
      --surface-head: #f4f7fa;/* 表頭淡藍底 */
      --hairline: #f0f0ec;    /* 極淡分隔線 */
      --tint-green: #eef7f0; --tint-green-bd: #c1e2c8;
      --tint-pink: #fcefef;  --tint-pink-bd: #f1c7c7;
      --tint-amber: #fdf7e8; --tint-amber-bd: #edd79d;
      --tint-blue: #ecf2f8;  --tint-blue-bd: #bdd3e5;
      --mark-bg: #fff2cc;
      --seg-track: #e2e2dd;
      --trial-bg: linear-gradient(100deg, #eef7f8, #f3eee4);
      --trial-bd: #cfe0e2;
      --grp-tag-bg: #f4f4f0;
      --grp-tag-bd: #d8d8d0;
      --plan-hl-bg: linear-gradient(160deg,#eef7f8,#f3eee4);

      --jp-blue: #4981af;
      --jp-green: #5d9e69;
      --jp-pink: #c56969;
      --jp-yellow: #cba369;
      --jp-purple: #8c6fb1;
      
      --shadow-material: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    /* 深色模式:翻轉設計變數(配 AntD darkAlgorithm,元件與 var() 樣式一起變深) */
    body.nc-dark {
      --bg-main: #1b1f24;
      --bg-card: #23282e;
      --border-color: #3a4047;
      --text-main: #e7e9ec;
      --text-muted: #aeb4ba;
      --text-light: #7e868d;
      --surface-1: #20252b;
      --surface-2: #2e343b;
      --surface-head: #2a313a;
      --hairline: #2c3238;
      --tint-green: #172f21; --tint-green-bd: #264f33;
      --tint-pink: #341a1a;  --tint-pink-bd: #532929;
      --tint-amber: #312a11; --tint-amber-bd: #52481e;
      --tint-blue: #182c3f;  --tint-blue-bd: #25425a;
      --mark-bg: #4a4422;
      --seg-track: #2e343b;
      --trial-bg: linear-gradient(100deg, #20303a, #2a2b24);
      --trial-bd: #3a4a55;
      --grp-tag-bg: #2a3038;
      --grp-tag-bd: #3a4047;
      --plan-hl-bg: linear-gradient(160deg,#26333d,#2c2f2a);
      --jp-blue: #6ba2cc;
      --jp-green: #79b884;
      --jp-pink: #db8888;
      --jp-yellow: #dec187;
      --jp-purple: #a78fc8;
      --shadow-material: 0 2px 10px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.35);
    }

    body, body * { transition: background-color .25s ease, border-color .25s ease, color .15s ease; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Outfit', 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Outlined Tags (Morandi style) */
    /* 刪除(垃圾桶):預設淡灰，滑鼠移到該列(或按鈕本身)才轉紅，把視覺乾淨度還給數據 */
    .nc-del-btn { color: var(--text-light) !important; transition: color .15s ease; }
    .ant-table-row:hover .nc-del-btn, .nc-del-btn:hover, .nc-del-btn:focus { color: var(--jp-pink) !important; }
    .nc-ind-pencil { opacity: 0; max-width: 0; margin-left: 0; transition: opacity .15s ease, max-width .15s ease, margin-left .15s ease; }
    .nc-ind-tag:hover .nc-ind-pencil { opacity: 0.55; max-width: 12px; margin-left: 1px; }

    .custom-tag {
      font-size: 0.75rem !important;
      font-weight: 500 !important;
      border-radius: 4px !important;
      padding: 2px 8px !important;
      border: 1px solid var(--grp-tag-bd) !important;
      background: var(--grp-tag-bg) !important;
      color: var(--text-muted) !important;
      white-space: nowrap !important;  /* 維持單行(不換行);靠加寬欄位讓長標籤放得下 */
    }

    /* ── #7 微互動回饋:全站一致的 hover / 過渡 ───────────────── */
    .ant-card { transition: box-shadow .22s ease, border-color .22s ease; }
    /* 內容卡 hover 時陰影加深(濾掉貼頂的篩選列，避免捲動時抖動) */
    .ant-card:not(.sticky-filters):hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04); }
    body.nc-dark .ant-card:not(.sticky-filters):hover { box-shadow: 0 8px 22px rgba(0,0,0,0.5); }
    /* 可點標籤:輕微浮起 + 陰影，明確「可按」 */
    .ant-tag { transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; }
    .custom-tag, .ant-tag[style*="cursor: pointer"], .ant-tag[style*="cursor:pointer"] { cursor: pointer; }
    .custom-tag:hover,
    .ant-tag[style*="cursor: pointer"]:hover,
    .ant-tag[style*="cursor:pointer"]:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
    /* 按鈕與表格列:統一過渡 */
    .ant-btn { transition: all .18s ease !important; }
    .ant-table-tbody > tr { transition: background-color .15s ease; }
    .ant-segmented-item { transition: color .15s ease, background .15s ease; }
    /* 全域訊息(message)icon 改用莫蘭迪色(靜態 message 不吃 ConfigProvider 主題);用 icon 類名鎖定最穩 */
    .ant-message .anticon-check-circle { color: var(--jp-green) !important; }
    .ant-message .anticon-info-circle { color: var(--jp-blue) !important; }
    .ant-message .anticon-exclamation-circle { color: var(--jp-yellow) !important; }
    .ant-message .anticon-close-circle { color: var(--jp-pink) !important; }
    .ant-message .anticon-loading { color: var(--jp-blue) !important; }
    .ant-message-success .anticon { color: var(--jp-green) !important; }
    .ant-message-info .anticon { color: var(--jp-blue) !important; }
    .ant-message-warning .anticon { color: var(--jp-yellow) !important; }
    .ant-message-error .anticon { color: var(--jp-pink) !important; }
    /* 深色/淺色切換:主要面板的底色·邊框·文字平滑漸變，避免硬跳(圖表為 canvas 不受影響) */
    body, .ant-layout, .ant-card, .ant-card-head, .ant-table, .ant-table-thead > tr > th,
    .ant-table-tbody > tr > td, .ant-segmented, .ant-modal-content, .ant-input,
    .ant-select-selector, .ant-divider, .sticky-filters {
      transition: background-color .3s ease, border-color .3s ease, color .3s ease;
    }

    /* 隱藏指定表頭欄位的垂直分隔線(例：輿情表的對齊空白欄) */
    .ant-table-thead th.col-no-sep::before {
      display: none !important;
    }

    /* 帶滑動效果的切換器(藍底滑塊 + 白字) */
    .nice-segmented.ant-segmented {
      background: var(--seg-track) !important;
      padding: 3px !important;
      border-radius: 9px !important;
    }
    .nice-segmented .ant-segmented-item {
      color: var(--text-muted) !important;
      transition: color 0.25s ease !important;
      border-radius: 6px !important;
    }
    .nice-segmented .ant-segmented-item-selected,
    .nice-segmented .ant-segmented-thumb {
      background: var(--jp-blue) !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 6px rgba(92,127,156,0.35) !important;
    }
    .nice-segmented .ant-segmented-item-selected .ant-segmented-item-label,
    .nice-segmented .ant-segmented-item-selected {
      color: #fff !important;
    }
    .nice-segmented .ant-segmented-item:hover:not(.ant-segmented-item-selected) {
      color: var(--jp-blue) !important;
    }

    /* Flashing Pulse Alert Card for Competitor Crisis */
    @keyframes pulse-border {
      0% { border-color: var(--border-color); box-shadow: var(--shadow-material); }
      50% { border-color: var(--jp-pink); box-shadow: 0 0 12px rgba(181, 121, 121, 0.35); }
      100% { border-color: var(--border-color); box-shadow: var(--shadow-material); }
    }
    
    .crisis-card-active {
      animation: pulse-border 2.5s infinite;
      background-color: #fff9f9 !important;
      border-width: 1.5px !important;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #efefe9;
    }
    ::-webkit-scrollbar-thumb {
      background: #c2c2bc;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a1a19b;
    }

    /* ===== 登入頁：Apple 風 — 乾淨留白、白卡、單一藍色重點 ===== */
    .nc-login-bg {
      position: fixed; inset: 0; overflow: auto;
      background: linear-gradient(165deg, #1b2530 0%, #141d27 55%, #0d141b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    /* 白點層:細點 + 緩慢飄移 + 呼吸式明暗(讓畫面有生命感)。z-index:-1 留在父層堆疊內、永遠在內容之下 */
    .nc-login-bg::before {
      content: ""; position: fixed; inset: -30%; z-index: -1; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.30) 1.1px, transparent 1.5px);
      background-size: 26px 26px;
      animation: nc-dots-drift 26s linear infinite, nc-dots-twinkle 7s ease-in-out infinite;
      will-change: transform, opacity;
    }
    /* 流動極光:兩團品牌色柔光從卡片「後方上下」中央暈開、緩慢飄移(刻意不碰左右邊，避免邊緣被染色) */
    .nc-aurora { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .nc-aurora::before, .nc-aurora::after {
      content: ""; position: absolute; left: 50%; width: 70vw; height: 70vw; max-width: 820px; max-height: 820px;
      margin-left: -35vw; border-radius: 50%; filter: blur(90px); mix-blend-mode: screen; will-change: transform;
    }
    .nc-aurora::before {  /* 上方中央，向下微沉 */
      top: -34vh;
      background: radial-gradient(circle at center, rgba(63,200,212,0.30), rgba(63,200,212,0) 66%);
      animation: nc-aurora-a 9s ease-in-out infinite;
    }
    .nc-aurora::after {   /* 下方中央，向上微升 */
      bottom: -34vh;
      background: radial-gradient(circle at center, rgba(127,224,192,0.22), rgba(127,224,192,0) 66%);
      animation: nc-aurora-b 11s ease-in-out infinite;
    }
    @keyframes nc-dots-drift {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(26px, -26px, 0); }  /* 對角線各一格 → 無縫循環 */
    }
    @keyframes nc-dots-twinkle { 0%,100% { opacity: 0.38; } 50% { opacity: 0.62; } }
    /* 登入 logo:雷達掃描扇形繞中心(24,24)旋轉;光點隨掃描週期 ping(被掃到才亮) */
    .nc-radar-sweep { transform-box: view-box; transform-origin: 24px 24px; animation: nc-radar-spin 4s linear infinite; }
    @keyframes nc-radar-spin { to { transform: rotate(360deg); } }
    /* 分類雷達圖背景:網格線後方的微弱雷達掃描光圈(呼應「數位戰略雷達」) */
    /* 雷達掃描光圈:位置/大小/邊數由 JS 依雷達實際圓心與類別數動態套用(inline),CSS 只管外觀與旋轉 */
    .nc-radar-bg {
      position: absolute; transform: translate(-50%, -50%); z-index: 0; pointer-events: none;
      background: radial-gradient(circle, rgba(92,127,156,0.05), rgba(92,127,156,0) 72%);
    }
    .nc-radar-bg::before {
      content: ""; position: absolute; inset: 0;
      background: conic-gradient(from 0deg, rgba(92,127,156,0.11) 0deg, rgba(92,127,156,0) 66deg, rgba(92,127,156,0) 360deg);
      animation: nc-radar-spin 7s linear infinite;
    }
    body.nc-dark .nc-radar-bg { background: radial-gradient(circle, rgba(140,170,200,0.05), rgba(140,170,200,0) 72%); }
    body.nc-dark .nc-radar-bg::before { background: conic-gradient(from 0deg, rgba(140,170,200,0.11) 0deg, rgba(140,170,200,0) 66deg, rgba(140,170,200,0) 360deg); }
    @media (prefers-reduced-motion: reduce) { .nc-radar-bg::before { animation: none; } }
    /* 光點:被掃描掃到瞬間亮起、快速淡到全暗(不殘留);多顆散佈不同方位，各自延遲對齊掃描角度 */
    .nc-radar-blip { opacity: 0; animation: nc-radar-blip 4s ease-out infinite; }
    @keyframes nc-radar-blip {
      0% { opacity: 0.9; }
      10% { opacity: 0.7; }
      40%, 100% { opacity: 0; }
    }
